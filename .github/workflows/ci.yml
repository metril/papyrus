name: CI

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-shard:
    name: backend (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: papyrus
          POSTGRES_PASSWORD: papyrus
          POSTGRES_DB: papyrus_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U papyrus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install system dependencies
        # ghostscript keeps the gs-dependent thumbnail test running so the
        # skipped-tests guard below never trips on an optional-dep skip.
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev ghostscript

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff
        if: matrix.shard == 0
        working-directory: backend
        run: ruff check app tests

      - name: OpenAPI schema is up to date
        if: matrix.shard == 0
        working-directory: backend
        run: python -m app.openapi_export --check

      - name: Pytest
        working-directory: backend
        env:
          PAPYRUS_TEST_DB_URL: postgresql+asyncpg://papyrus:papyrus@localhost:5433/papyrus_test
        run: pytest -q --shard ${{ matrix.shard }}/4 --junitxml=pytest.xml

      - name: Fail if any tests were skipped
        working-directory: backend
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest.xml").getroot()
          skipped = sum(int(suite.get("skipped", 0)) for suite in root.iter("testsuite"))
          print(f"skipped tests: {skipped}")
          if skipped:
              print(
                  "::error::Integration tests were skipped in CI — the test "
                  "Postgres service must be reachable here. Check the "
                  "postgres service health check and PAPYRUS_TEST_DB_URL."
              )
              sys.exit(1)
          PY

  backend:
    # Aggregator: keeps the required check name "backend".
    needs: backend-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: |
          test "${{ needs.backend-shard.result }}" = "success" || {
            echo "::error::backend shards: ${{ needs.backend-shard.result }}"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Eslint
        working-directory: frontend
        run: npx eslint .

      - name: Generated API types are up to date
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code src/types/api.gen.ts

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  arm64:
    # Native arm64 runner: the image must build, the backend suite must pass,
    # and the container must answer /health. brscan4 is amd64-only, so this
    # image ships native Brother scanning only.
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: papyrus
          POSTGRES_PASSWORD: papyrus
          POSTGRES_DB: papyrus_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U papyrus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev ghostscript

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Pytest
        working-directory: backend
        env:
          PAPYRUS_TEST_DB_URL: postgresql+asyncpg://papyrus:papyrus@localhost:5433/papyrus_test
        run: pytest -q

      - name: Build image
        run: docker build -f docker/Dockerfile -t papyrus:arm64-ci .

      - name: Image has the native stack and no brscan4
        run: |
          docker run --rm --entrypoint python papyrus:arm64-ci \
            -c 'import app.services.brother_client, app.services.scan_service, img2pdf, PIL'
          docker run --rm --entrypoint sh papyrus:arm64-ci -c \
            'which scanimage && ! which brsaneconfig4'

      - name: Container answers /health
        run: |
          docker run -d --name papyrus --network host --cap-add SYS_ADMIN \
            -e PAPYRUS_DB_URL=postgresql+asyncpg://papyrus:papyrus@localhost:5433/papyrus_test \
            -e PAPYRUS_SESSION_SECRET=ci-session-secret-not-for-production \
            -e PAPYRUS_BASE_URL=http://localhost:8080 \
            -e PAPYRUS_DEV_MODE=true \
            papyrus:arm64-ci
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/system/health; then exit 0; fi
            sleep 2
          done
          docker logs papyrus
          exit 1
