name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: metril/papyrus
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches project version
        run: |
          set -e
          TAG_VERSION="${{ steps.version.outputs.version }}"
          PYPROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml)
          PACKAGE_VERSION=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' frontend/package.json)
          MAIN_VERSION=$(sed -n 's/.*version="\([^"]*\)".*/\1/p' backend/app/main.py)
          echo "tag=$TAG_VERSION pyproject.toml=$PYPROJECT_VERSION package.json=$PACKAGE_VERSION main.py=$MAIN_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ] || [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$MAIN_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match backend/pyproject.toml ($PYPROJECT_VERSION), frontend/package.json ($PACKAGE_VERSION), and/or backend/app/main.py ($MAIN_VERSION)"
            exit 1
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Papyrus
            org.opencontainers.image.description=Web-based print and scan server for network printers
            org.opencontainers.image.source=https://github.com/metril/papyrus
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker Image

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ```

            See the [README](https://github.com/metril/papyrus#readme) for setup instructions.
